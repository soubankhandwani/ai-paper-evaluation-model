<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Answer Checker</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
    }

    .container {
      max-width: 600px;
      margin-top: 50px;
    }

    .form-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-label {
      font-weight: 500;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      background-color: #0d6efd;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      color: #333;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="form-container">
      <h1>Upload Files</h1>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="teacher_pdf" class="form-label">Teacher's Answer Key (PDF):</label>
          <input type="file" class="form-control" name="teacher_pdf" id="teacher_pdf" required>
        </div>
        <div class="mb-3">
          <label for="student_pdf" class="form-label">Student's Answer (PDF):</label>
          <input type="file" class="form-control" name="student_pdf" id="student_pdf" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS (Optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
